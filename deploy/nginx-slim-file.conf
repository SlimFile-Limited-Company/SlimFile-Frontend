# www.slim-file.com - the SlimFile web app (static Vite build), on the Contabo server.
# Installed at /etc/nginx/sites-available/slim-file-frontend.
# Files live in /opt/slimfile-frontend/current (a symlink to the latest release).
# The app calls the API at https://service.slim-file.com/api, so nothing is proxied here.

# Link-preview bots (same list as middleware.js). They get the per-page HTML from
# dist/_preview/ made by deploy/build-previews.mjs.
map $http_user_agent $slimfile_bot {
    default 0;
    "~*facebookexternalhit|facebot|linkedinbot|twitterbot|whatsapp|slackbot|telegrambot|discordbot|skypeuripreview|pinterest|redditbot|embedly|applebot|vkshare|snapchat" 1;
}

# Only plain feature names may be used to pick an AI Lab preview file.
map $arg_feature $slimfile_ai_feature {
    default "";
    "~^[a-z]+$" $arg_feature;
}

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name slim-file.com www.slim-file.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.slim-file.com$request_uri; }
}

# slim-file.com -> www.slim-file.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slim-file.com;

    ssl_certificate     /etc/letsencrypt/live/www.slim-file.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.slim-file.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.slim-file.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.slim-file.com;

    ssl_certificate     /etc/letsencrypt/live/www.slim-file.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.slim-file.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/slim-file-frontend.access.log;
    error_log  /var/log/nginx/slim-file-frontend.error.log;

    root /opt/slimfile-frontend/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # Old links (were in vercel.json).
    location = /news/chinelo-adaugo-nnamdi-kanu-alchie { return 301 /news/chinelo-adaugo-nnamdi-kanu-alche; }
    # Only a visitor typing /index.html is redirected; the app's own fallback to
    # index.html is internal and must not be.
    if ($request_uri ~ ^/index\.html(\?|$)) { return 301 /; }
    location = /compressor.html  { return 301 /compress; }
    location = /multi-index.html { return 301 /compress; }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must always be fresh.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Bots never see the preview copies directly.
    location /_preview/ { internal; }

    location / {
        error_page 418 = @preview;
        if ($slimfile_bot) { return 418; }
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Link-preview bots: the page's own preview copy if there is one, else the normal page.
    location @preview {
        add_header Cache-Control "no-cache";
        try_files /_preview$uri/$slimfile_ai_feature.html /_preview$uri.html $uri /index.html;
    }
}
